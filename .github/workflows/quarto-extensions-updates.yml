name: Quarto Extensions Updates

# Keeps the extensions current: the documentation website's own dependencies
# under docs/_extensions/, and the tools embedded in _extensions/mcanouil/.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: 00 12 1 * *

permissions:
  contents: read

jobs:
  updates:
    uses: mcanouil/quarto-workflows/.github/workflows/quarto-extensions-updates.yml@v2
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      gh-app-id: ${{ vars.APP_ID }}
      scan-directories: |
        docs
        _extensions/mcanouil
