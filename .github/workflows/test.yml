name: Test

# The extension tests render the test documents and check the output, so a
# pull request runs them unless it is still a draft. The default activity types
# fire nothing when a pull request leaves draft, so `ready_for_review` is what
# runs the tests once the draft is lifted.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.draft == false
    uses: mcanouil/quarto-extension-test/.github/workflows/extension-test.yml@0.4.0
    with:
      apt-packages: poppler-utils
      quarto-tools: verapdf
