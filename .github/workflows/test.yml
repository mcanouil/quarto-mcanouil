name: Test

# The extension tests render the test documents and check the output, so a
# pull request runs them unless it is still a draft. The default activity types
# fire nothing when a pull request leaves draft, so `ready_for_review` is what
# runs the tests once the draft is lifted.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft == false
    uses: mcanouil/quarto-extension-test/.github/workflows/extension-test.yml@0.4.1
    with:
      # The extension requires Quarto 1.12.1, which is only on the pre-release
      # channel until Quarto 1.12 is released.
      quarto-channels: '["pre-release"]'
      apt-packages: poppler-utils
      quarto-tools: verapdf
      # The HTML checks measure the rendered page in a headless Chromium.
      node-version: "26"
      playwright-browsers: chromium
