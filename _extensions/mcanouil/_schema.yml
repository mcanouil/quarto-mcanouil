$schema: https://m.canouil.dev/quarto-wizard/assets/schema/v2/extension-schema.json
options:
  preset:
    type: string
    enum:
      - gold
      - mono
      - quarto
      - terminal
    default: gold
    description: "Preset for every format: colours, fonts and style. Set it as `extensions: { mcanouil: { preset: <name> } }` in the front matter or in `_quarto.yml`."
  chapter-toc-depth:
    type: number
    minimum: 1
    default: 2
    description: "Number of heading levels under a chapter that the chapter contents page of a full report lists. 1 lists the sections only, 2 adds the subsections. Set it as `extensions: { mcanouil: { chapter-toc-depth: <n> } }`."
  letter-standard:
    type: string
    enum:
      - nf
      - din
    description: "Standard of a letter or an invoice: nf follows NF Z 11-001 with the address window on the right, din follows DIN 5008 form B with the address window on the left and a reference block. When it is not set, the language of the document chooses: fr gives nf, de gives din, and any other language gives nf. Set it as `extensions: { mcanouil: { letter-standard: <name> } }`."
  header:
    type: object
    additionalProperties: false
    description: "Content of the three header slots of Typst pages. Each slot holds text, or one of the fields title, subtitle, author, date, version, chapter and page. An empty string leaves the slot empty. A slot that is not set takes the default of the document type."
    properties:
      left:
        type: string
        description: "Content of the left header slot, aligned left."
      centre:
        type: string
        aliases: [center]
        description: "Content of the centre header slot, centred."
      right:
        type: string
        description: "Content of the right header slot, aligned right."
  footer:
    type: object
    additionalProperties: false
    description: "Content of the three footer slots of Typst pages and Reveal.js slides. Each slot holds text, or one of the fields title, subtitle, author, date, version, chapter, page, speaker (the authors and the event), event and session (for example "Session 2"). An empty string leaves the slot empty. A slot that is not set takes the default of the document type; a deck shows the speaker and the event, the talk title, and the slide number; a workshop shows the event, the session and the page or slide number."
    properties:
      left:
        type: string
        description: "Content of the left footer slot, aligned left."
      centre:
        type: string
        aliases: [center]
        examples: ["Confidential"]
        description: "Content of the centre footer slot, centred."
      right:
        type: string
        examples: [page]
        description: "Content of the right footer slot, aligned right. In a Reveal.js deck, only `page` here shows the slide number."
  event:
    type: string
    description: "Event of a Reveal.js deck, for example `useR! 2026 · Warwick`. The title slide shows it above the title, and the left footer slot after the speaker. Set it as `extensions: { mcanouil: { event: <text> } }`."
  speakers:
    type: array
    description: "Photos of the speakers on the title slide of a Reveal.js deck, one entry per author, in the order of the authors. A photo without alt text gives a warning."
    items:
      type: object
      additionalProperties: false
      properties:
        photo:
          type: string
          description: "Photo file (svg, png, jpg, gif or webp), relative to the document. The deck embeds it."
        alt:
          type: string
          description: "Alt text of the photo."
  closing:
    type: [object, boolean]
    additionalProperties: false
    description: "Closing slide of a Reveal.js deck, on the ground of the preset. `true` adds it with the default title; a map sets its parts. Links are shown as plain text, so they read in a PDF export too."
    properties:
      title:
        type: string
        description: "Title of the closing slide. Default: \"Thank you\" in the document language."
      links:
        type: array
        items:
          type: string
        description: "Links of the closing slide, one per line, as plain text."
      licence:
        type: string
        description: "Licence line of the closing slide, for example `Slides: example.org/talk · CC BY 4.0`."
  session:
    type: object
    additionalProperties: false
    description: "Session of a workshop: its number and the number of sessions. The kicker shows \"Session 2 of 7\", exercises are numbered 2.1, 2.2, and the session field of the footer shows \"Session 2\". Set it as `extensions: { mcanouil: { session: { number: 2, total: 7 } } }`."
    properties:
      number:
        type: [number, string]
        description: "Number of the session."
      total:
        type: [number, string]
        description: "Number of sessions of the workshop."
  duration:
    type: string
    description: "Duration of a workshop session, for example `90 min`. The title block shows it beside the date."
  solutions:
    type: string
    enum:
      - end
      - inline
      - hide
    default: end
    description: "Place of the exercise solutions in the PDF handout of a workshop: end collects them on the last pages behind a \"Solution: page n\" link in each exercise, inline prints each one in its exercise, hide leaves them out. HTML shows each solution as a closed disclosure and Reveal.js as a block of the veil group solutions, hidden until shown."

classes:
  objectives:
    description: "Workshop block: what the session teaches. It shows the label Objectives."
  prerequisites:
    description: "Workshop block: what the session needs. It shows the label Prerequisites."
  exercise:
    description: "Workshop block: an exercise, labelled with its number, its duration and its format. It can hold a solution block."
  solution:
    description: "Workshop block, inside an exercise: the solution of the exercise. HTML shows it as a closed disclosure, Reveal.js as a block of the veil group solutions, and the PDF handout as the solutions option says."
  checkpoint:
    description: "Workshop block: a check of the work so far. It shows the label Checkpoint."

attributes:
  exercise:
    duration:
      type: string
      description: "Time the exercise takes, for example `15 min`, shown in its label."
    format:
      type: string
      description: "How the exercise is done, for example `pairs` or `solo`, shown in its label."
