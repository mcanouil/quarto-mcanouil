# Schema for the codefrag extension
# Describes plugin options for IDE tooling and runtime validation.

# Extension-level metadata options.
# Configured in _quarto.yml, _metadata.yml, or document front matter:
#   extensions:
#     codefrag:
#       enabled: true

$schema: https://m.canouil.dev/quarto-wizard/assets/schema/v2/extension-schema.json

options:
  enabled:
    type: boolean
    default: true
    description: "Enable or disable code annotation fragment navigation."
  patch-tooltip-overflow:
    type: boolean
    default: true
    description: "Move annotation tooltips to a non-clipping ancestor (typically the enclosing slide section) so they escape inner `overflow: hidden` containers. Set to `false` to keep Quarto's default `appendTo` target."
  on-annotation-shown:
    type: string
    description: "Optional JavaScript callback invoked when an annotation tooltip is shown. Receives `{ anchor, slide, targetCell, targetAnnotation, tippy }`. Configured in HTML (e.g. via `format.revealjs.include-in-header`) because YAML cannot serialise functions."

attributes:
  code-block:
    code-annotation-fragment-indices:
      type: string
      description: "Comma-separated fragment indices assigned to each code annotation, in annotation order (e.g. \"2,4,6\"). Non-numeric tokens emit a console warning and the affected slot is left unindexed."
    code-line-fragment-indices:
      type: string
      description: "Comma-separated fragment indices assigned to each line-highlight step, starting with the original code as step 0 (e.g. \"0,2,4,6\"). Requires `code-line-numbers`. Non-numeric tokens emit a console warning and the affected step is left unchanged."
