title: Mickaël Canouil's Brand
author: Mickaël Canouil
version: 0.22.0
quarto-required: ">=1.12.1"
contributes:
  formats:
    common:
      shortcodes:
        - iconify
      filters:
        - lua/mcanouil.lua
        - offset-headings
        - div-reuse
        - toc-depth
        - highlight-text
        - iconify
        - prism
        - code-window
        - veil
        - typst-render
        - gitlink
        - preview-colour
        - lua/mcanouil-post.lua
      extensions:
        preview-colour:
          text: false
          code: false
    html:
      filters:
        - mobile-toc
        - collapse-output
      theme:
        - html/base.scss
    typst:
      template-partials:
        - typst/typst-template.typ
        - typst/typst-show.typ
    revealjs:
      filters:
        - cascade
        - codefrag
        - collapse-output
      revealjs-plugins:
        - veil
        - tabset
        - codefrag
      theme:
        - revealjs/theme.scss
