title: Mickaël Canouil's Brand
author: Mickaël Canouil
version: 0.22.0
quarto-required: ">=1.12.1"
contributes:
  formats:
    common:
      language: _language.yml
      shortcodes:
        - iconify
      filters:
        - lua/mcanouil.lua
        - offset-headings
        - div-reuse
        - toc-depth
        - highlight-text
        - iconify
        - prism
        - code-window
        - veil
        - typst-render
        - gitlink
        - preview-colour
        - path: lua/mcanouil-post.lua
          at: post-quarto
      extensions:
        preview-colour:
          text: false
          code: false
    html:
      filters:
        - mobile-toc
        - collapse-output
        - remember
      extensions:
        remember:
          enabled: false
      respect-user-color-scheme: true
      title-block-banner: true
      template-partials:
        - html/partials/title-block.html
      theme:
        light:
          - html/tokens.scss
          - html/base.scss
          - html/motifs.scss
          - html/components.scss
          - html/navigation.scss
          - html/presets/_gold.scss
          - html/presets/_mono.scss
          - html/presets/_quarto.scss
          - html/presets/_terminal.scss
          - html/decoration.scss
        dark:
          - html/tokens.scss
          - html/base.scss
          - html/motifs.scss
          - html/components.scss
          - html/navigation.scss
          - html/presets/_gold.scss
          - html/presets/_mono.scss
          - html/presets/_quarto.scss
          - html/presets/_terminal.scss
          - html/decoration.scss
          - html/scheme-dark.scss
    typst:
      font-paths: fonts
      pdf-standard: ua-1
      extensions:
        offset-headings:
          quarto-shift-warning: false
      template-partials:
        - typst/lib/tokens.typ
        - typst/lib/labels.typ
        - typst/lib/decoration.typ
        - typst/lib/quote.typ
        - typst/lib/motifs.typ
        - typst/lib/chrome.typ
        - typst/lib/slots.typ
        - typst/lib/logo.typ
        - typst/lib/authors.typ
        - typst/lib/title.typ
        - typst/lib/toc.typ
        - typst/types/report.typ
        - typst/types/article.typ
        - typst/types/memo.typ
        - typst/typst-template.typ
        - typst/typst-show.typ
    revealjs:
      filters:
        - cascade
        - codefrag
        - collapse-output
        - remember
      extensions:
        remember:
          enabled: false
      revealjs-plugins:
        - veil
        - tabset
        - codefrag
      template-partials:
        - revealjs/partials/title-slide.html
      slide-number: c/t
      progress: true
      width: 1280
      height: 720
      margin: 0
      center-title-slide: false
      theme:
        - revealjs/theme.scss
        - revealjs/slides.scss
